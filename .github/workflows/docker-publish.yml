# docker-publish.yml — build the deepseek-harness image and publish on release.
#
# Usage:
#   1. Put this workflow in .github/workflows/ of your GitHub repo
#      (e.g. fork of this docker/ directory).
#   2. The job uses the built-in GITHUB_TOKEN with packages: write.
#   3. Push a tag like v0.2.2-rc.1 — or run it manually via Actions -> Run workflow.
#
# The image is published to ghcr.io; use that reference in the RainYun RCA
# template's 镜像 field.

name: docker-publish

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'npm version of @deepseek-ai/dsh to install (e.g. 0.2.2-rc.1)'
        required: true
        default: '0.2.2-rc.1'
  push:
    tags:
      - 'v*'

env:
  IMAGE_NAME: deepseek-harness

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve DSH version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dsh_version=${{ inputs.dsh_version }}" >> "$GITHUB_OUTPUT"
            echo "image_tag=${{ inputs.dsh_version }}" >> "$GITHUB_OUTPUT"
          else
            V="${GITHUB_REF_NAME#v}"
            echo "dsh_version=$V" >> "$GITHUB_OUTPUT"
            echo "image_tag=$V" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: DSH_VERSION=${{ steps.version.outputs.dsh_version }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }}

      - name: Smoke test (auth mode boot + login)
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 3081:3080 -e DSH_HOME=/data -e PORT=3080 \
            -e DSH_AUTH_PASSWORD=SmokePass123 \
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }}
          for i in $(seq 1 40); do
            docker logs smoke 2>&1 | grep -q 'auth] gate listening' && break
            sleep 1
          done
          docker logs smoke 2>&1 | grep -q 'auth] gate listening'
          # unauthenticated API must be refused by the gate
          curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3081/api/health | grep -q '401'
          # login, then follow dsh's launch-token redirect with the cookie jar
          JAR=$(mktemp)
          curl -s -c "$JAR" -o /dev/null -X POST -d 'password=SmokePass123' http://127.0.0.1:3081/login
          curl -s -L -b "$JAR" -c "$JAR" http://127.0.0.1:3081/ | grep -q '__DSH_BOOT__'
          docker rm -f smoke >/dev/null

      - name: Push to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          TAG=${{ steps.version.outputs.image_tag }}
          IMG=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:$TAG
          docker tag ${{ env.IMAGE_NAME }}:$TAG $IMG
          docker push $IMG
